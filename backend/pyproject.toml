[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "vr-room-backend"
version     = "0.1.0"
description = "Recovery mode API for 仕事効率版・精神と時の部屋"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
]

[project.optional-dependencies]
openai  = ["openai>=1.30"]
claude  = ["anthropic>=0.28"]
dev     = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",     # required by TestClient
]

[tool.pytest.ini_options]
testpaths   = ["tests"]
asyncio_mode = "auto"
